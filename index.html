<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC Viewer</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">▣</span>
          <span class="brand-name">IFC Viewer</span>
          <span class="brand-sub">просмотр модели и проверки</span>
        </div>
        <div class="topbar-actions">
          <span id="status" class="status"></span>
          <button id="btn-undo" class="btn btn-icon" type="button"
                  title="Отменить (Ctrl/Cmd+Z)" aria-label="Отменить" disabled>↶</button>
          <button id="btn-redo" class="btn btn-icon" type="button"
                  title="Повторить (Ctrl/Cmd+Shift+Z)" aria-label="Повторить" disabled>↷</button>
          <button id="btn-isolate" class="btn" type="button">Изолировать</button>
          <button id="btn-hide" class="btn" type="button">Скрыть</button>
          <button id="btn-showall" class="btn" type="button">Показать всё</button>
          <label class="btn">
            Открыть TRM
            <input id="trm-input" type="file" hidden />
          </label>
          <label class="btn">
            Открыть BCF
            <input id="bcf-input" type="file" accept=".bcf,.bcfzip,.zip" hidden />
          </label>
          <label class="btn btn-primary">
            Открыть IFC
            <input id="file-input" type="file" accept=".ifc,.zip" multiple hidden />
          </label>
        </div>
      </header>

      <main class="layout">
        <aside id="sidebar" class="sidebar">
          <details id="checks" class="checks" open>
            <summary>
              <span class="checks-title">Проверки IFC</span>
              <button id="checks-popout" class="checks-popout" type="button"
                      title="Вынести в отдельное окно">⤢</button>
            </summary>
            <div class="checks-body">
              <button id="chk-run" class="chk-run" type="button" disabled>
                Выполнить все
              </button>
              <div id="chk-result" class="chk-result"></div>
            </div>
          </details>
          <div id="checks-resizer" class="pane-resizer" title="Потяните, чтобы изменить размер"></div>
          <div id="pane-list" class="pane pane-list">
            <div id="model-tree" class="model-tree"></div>
            <details id="sections" class="sections">
              <summary><span class="sections-title">Сечения</span></summary>
              <div id="section-panel" class="section-panel"></div>
            </details>
            <button id="btn-view" class="view-btn" type="button" hidden>
              📄 Вид модели (TRM)
            </button>
            <input
              id="filter"
              class="filter"
              type="search"
              placeholder="Фильтр: тип, имя, #id, GUID"
            />
            <div id="element-list" class="element-list"></div>
          </div>
          <div id="pane-resizer" class="pane-resizer" title="Потяните, чтобы изменить размер"></div>
          <div class="pane pane-props">
            <div id="properties" class="properties"></div>
          </div>
        </aside>

        <section id="viewer" class="viewer">
          <div id="loading" class="loading" hidden>
            <span class="loading-spinner" aria-hidden="true"></span>
            <span id="loading-text" class="loading-text">Загрузка IFC…</span>
            <div id="loading-bar" class="loading-bar indeterminate">
              <div id="loading-bar-fill" class="loading-bar-fill"></div>
            </div>
          </div>
          <div id="viewer-notice" class="viewer-notice" hidden>
            <span id="viewer-notice-text" class="viewer-notice-text"></span>
          </div>
          <div id="clash-pop" class="clash-pop" hidden>
            <button id="clash-pop-close" class="clash-pop-close" type="button" title="Закрыть">×</button>
            <div id="clash-pop-title" class="clash-pop-title"></div>
            <div id="clash-pop-body" class="clash-pop-body"></div>
          </div>
        </section>
      </main>

      <div id="trm-overlay" class="trm-overlay" hidden>
        <header class="trm-topbar">
          <div class="trm-head">
            <span class="trm-badge">TRM</span>
            <span id="trm-title" class="trm-title"></span>
          </div>
          <div class="trm-actions">
            <button id="trm-analyze" class="btn" type="button" hidden>
              📊 Разбор чертежа
            </button>
            <button id="trm-close" class="btn" type="button">← К модели</button>
          </div>
        </header>
        <div class="trm-body">
          <aside id="trm-list" class="trm-list"></aside>
          <section id="trm-content" class="trm-content"></section>
          <aside id="trm-analysis" class="trm-analysis" hidden></aside>
        </div>
      </div>

      <div id="bcf-overlay" class="trm-overlay" hidden>
        <header class="trm-topbar">
          <div class="trm-head">
            <span class="trm-badge">BCF</span>
            <span id="bcf-title" class="trm-title"></span>
          </div>
          <div class="trm-actions">
            <button id="bcf-close" class="btn" type="button">← К модели</button>
          </div>
        </header>
        <div class="trm-body">
          <aside id="bcf-list" class="trm-list"></aside>
          <section id="bcf-content" class="trm-content bcf-content"></section>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
